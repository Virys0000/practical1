        // Инициализация страницы
        document.addEventListener('DOMContentLoaded', function() {
            createModelCards();
        });

        // Создание карточек моделей
        function createModelCards() {
            const modelsGrid = document.getElementById('modelsGrid');
            
            for (const model in carDatabase) {
                const modelCard = document.createElement('div');
                modelCard.className = 'model-card';
                modelCard.textContent = carDatabase[model].name.split(' ')[1]; // Берем только номер модели
                modelCard.setAttribute('data-model', model);
                modelCard.addEventListener('click', function() {
                    document.getElementById('carModel').value = this.getAttribute('data-model');
                    searchCar();
                    
                    // Подсветка активной карточки
                    document.querySelectorAll('.model-card').forEach(card => {
                        card.classList.remove('active');
                    });
                    this.classList.add('active');
                });
                
                modelsGrid.appendChild(modelCard);
            }
        }

        function searchCar() {
            const input = document.getElementById('carModel');
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const carModel = input.value.toLowerCase().trim();
            
            // Скрываем предыдущие результаты и ошибки
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            if (!carModel) {
                errorDiv.textContent = 'Пожалуйста, введите модель автомобиля';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Поиск в базе данных
            const car = carDatabase[carModel];
            
            if (car) {
                // Заполняем данные
                document.getElementById('carTitle').textContent = car.name;
                document.getElementById('carDescription').textContent = car.description;
                document.getElementById('carImage').src = car.image;
                document.getElementById('carImage').alt = car.name;
                document.getElementById('startDate').textContent = car.startDate;
                document.getElementById('productionYears').textContent = car.productionYears;
                document.getElementById('salesCount').textContent = car.salesCount;
                document.getElementById('carClass').textContent = car.carClass;
                
                // Заполняем характеристики
                const specsDiv = document.getElementById('specifications');
                specsDiv.innerHTML = '';
                car.specifications.forEach(spec => {
                    const specItem = document.createElement('div');
                    specItem.className = 'spec-item';
                    specItem.textContent = spec;
                    specsDiv.appendChild(specItem);
                });
                
                // Показываем результат
                resultDiv.style.display = 'block';
                
                // Подсветка активной карточки
                document.querySelectorAll('.model-card').forEach(card => {
card.classList.remove('active');
                    if (card.getAttribute('data-model') === carModel) {
                        card.classList.add('active');
                    }
                });
            } else {
                errorDiv.textContent = 'Автомобиль не найден в базе данных. Попробуйте другую модель.';
                errorDiv.style.display = 'block';
            }
        }

        function clearSearch() {
            document.getElementById('carModel').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            
            // Снимаем подсветку с карточек
            document.querySelectorAll('.model-card').forEach(card => {
                card.classList.remove('active');
            });
        }

        // Обработка нажатия Enter
        document.getElementById('carModel').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchCar();
            }
        });
